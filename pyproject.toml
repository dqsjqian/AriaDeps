[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "aria-deps"
version = "0.1.0"
description = "Project-agnostic dependency pipeline: resolve, fetch, patch, build and install C/C++ dependencies"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.optional-dependencies]
test = []

[tool.setuptools.packages.find]
where = ["."]
include = ["aria_deps*"]
